[project]
name = "repoman"
version = "0.1.0"
description = "Evidence-gathering copilot for people who evaluate software they did not write"
requires-python = ">=3.13"
dependencies = [
    "strands-agents[ollama,openai]>=1.56.0",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
    "boto3>=1.35",
    "httpx>=0.27",
    "pygments>=2.18",
    "cedarpy>=4",
]

[project.scripts]
repoman = "repoman.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repoman"]
